<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OneAI</title>
<meta name="description" content="Study platform for the TSA Artificial Intelligence event: interactive lessons, question bank, math problems, mock tests, semifinal practice and analytics.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111110'/%3E%3Cpath d='M9 22l7-13 7 13M12 17h8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root{
  color-scheme:light;
  --bg:#f7f7f5; --bg-2:#f1f1ee; --surface:#ffffff; --line:#e8e7e3; --line-2:#d6d5cf;
  --text:#111110; --text-2:#4b4a46; --muted:#878680;
  --accent:#2563eb; --accent-2:#1d4ed8; --accent-soft:#eef3fe; --accent-line:#c7d7fb;
  --ok:#15803d; --ok-soft:#edfaf2; --ok-line:#b7e6c8; --bad:#dc2626; --bad-soft:#fef3f2; --bad-line:#f6c9c6; --warn:#c2740a; --warn-soft:#fff8eb; --warn-line:#f5dcaa;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --h0:#ecebe7; --h1:#cde2fb; --h2:#86b6ef; --h3:#3987e5; --h4:#1c5cab;
  --shadow:0 1px 2px rgba(17,17,16,.04); --shadow-lg:0 16px 48px rgba(17,17,16,.16);
  --r:12px; --r-sm:8px; --side:236px;
  --font:'Inter',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif; --mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0e0e0d; --bg-2:#1a1a18; --surface:#151514; --line:#262624; --line-2:#363633;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8a8980;
  --accent:#5b8def; --accent-2:#7aa3f3; --accent-soft:#17213a; --accent-line:#2a3d6b;
  --ok:#3fbf75; --ok-soft:#10241a; --ok-line:#1e4a31; --bad:#f06a6a; --bad-soft:#2a1414; --bad-line:#5a2626; --warn:#e8a33a; --warn-soft:#2a2010; --warn-line:#5a4520;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --h0:#222220; --h1:#184f95; --h2:#256abf; --h3:#3987e5; --h4:#86b6ef;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0e0d; --bg-2:#1a1a18; --surface:#151514; --line:#262624; --line-2:#363633;
  --text:#f0efec; --text-2:#c3c2b7; --muted:#8a8980;
  --accent:#5b8def; --accent-2:#7aa3f3; --accent-soft:#17213a; --accent-line:#2a3d6b;
  --ok:#3fbf75; --ok-soft:#10241a; --ok-line:#1e4a31; --bad:#f06a6a; --bad-soft:#2a1414; --bad-line:#5a2626; --warn:#e8a33a; --warn-soft:#2a2010; --warn-line:#5a4520;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --h0:#222220; --h1:#184f95; --h2:#256abf; --h3:#3987e5; --h4:#86b6ef;
  --shadow:0 1px 2px rgba(0,0,0,.3); --shadow-lg:0 16px 48px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14.5px;line-height:1.55;-webkit-font-smoothing:antialiased;font-feature-settings:'cv11','ss01'}
a{color:var(--accent);text-decoration:none;cursor:pointer}
a:hover{text-decoration:underline}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
h1,h2,h3,h4{margin:0;line-height:1.25;letter-spacing:-.015em;font-weight:650}
p{margin:0 0 10px}
code,kbd,.mono{font-family:var(--mono);font-size:.88em}
code{background:var(--bg-2);padding:.08em .38em;border-radius:5px;border:1px solid var(--line)}
pre{background:var(--bg-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6;margin:8px 0;white-space:pre-wrap}
pre code{background:none;border:0;padding:0}
kbd{background:var(--surface);border:1px solid var(--line-2);border-bottom-width:2px;border-radius:5px;padding:0 5px;font-size:11px;color:var(--text-2)}
::selection{background:var(--accent-soft)}
.ic{flex-shrink:0;vertical-align:-3px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* layout */
.app{display:flex;min-height:100vh}
.side{width:var(--side);flex-shrink:0;background:var(--surface);border-right:1px solid var(--line);position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column;z-index:40;transition:transform .2s}
.brand{display:flex;align-items:center;gap:10px;padding:18px 18px 14px}
.brand-logo{width:30px;height:30px;border-radius:8px;background:var(--text);color:var(--bg);display:grid;place-items:center}
.brand-name{font-weight:700;font-size:16px;letter-spacing:-.02em}
.brand-sub{font-size:11.5px;color:var(--muted);margin-top:-2px}
.nav{padding:4px 10px;flex:1;overflow-y:auto}
.nav-sec{font-size:11px;font-weight:600;color:var(--muted);padding:14px 10px 5px;letter-spacing:.02em}
.nav a{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:8px;color:var(--text-2);font-weight:500;font-size:13.5px;margin-bottom:1px;text-decoration:none}
.nav a:hover{background:var(--bg-2);color:var(--text)}
.nav a.on{background:var(--bg-2);color:var(--text);font-weight:600}
.nav a.on .ic{color:var(--accent)}
.nav a em{margin-left:auto;font-style:normal;font-size:11px;font-weight:600;background:var(--accent);color:#fff;border-radius:99px;padding:0 7px;line-height:18px}
.nav a em.soft{background:var(--bg-2);color:var(--text-2);border:1px solid var(--line)}
.nav a em.live{background:var(--bad)}
.side-foot{padding:14px 18px 18px;border-top:1px solid var(--line);font-size:12px;color:var(--text-2)}
.sf-row{display:flex;justify-content:space-between;margin-bottom:7px}
.sf-proj{margin-top:9px;color:var(--muted);cursor:pointer}
.sf-proj b{color:var(--text)}
.main{flex:1;margin-left:var(--side);min-width:0}
.top{position:sticky;top:0;z-index:30;height:54px;display:flex;align-items:center;gap:8px;padding:0 24px;background:color-mix(in oklab,var(--bg) 85%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top h1{min-width:0;flex:1 1 auto;font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-btn{display:flex;align-items:center;gap:8px;height:32px;padding:0 10px;border:1px solid var(--line);background:var(--surface);border-radius:8px;color:var(--muted);font-size:13px;min-width:220px}
.search-btn:hover{border-color:var(--line-2)}
.search-btn kbd{margin-left:auto}
.top .menu-btn{display:none}
.content{max-width:1120px;margin:0 auto;padding:28px 28px 80px}
.content.wide{max-width:1280px}
.scrim{display:none}
@media (max-width:960px){
  .side{transform:translateX(-100%)} body.menu-open .side{transform:none;box-shadow:var(--shadow-lg)}
  body.menu-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:35}
  .main{margin-left:0} .top .menu-btn{display:inline-flex} .search-btn{min-width:0} .search-btn span,.search-btn kbd{display:none}
  .content{padding:20px 16px 72px}
  .top{padding:0 12px}
  .top .spacer{display:none}
  .le-nav{grid-template-columns:1fr}
  .le-btn.r{grid-column:1}
  .match{grid-template-columns:1fr}
  .prose{font-size:15px}
  .lh h1{font-size:25px}
}
html,body{overflow-x:hidden}

/* primitives */
.row{display:flex;align-items:center;gap:8px}
.row.wrap,.wrap{flex-wrap:wrap}
.spacer{flex:1}
.stack{display:flex;flex-direction:column;gap:16px;min-width:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-bottom:16px}
.g2.tight{gap:12px;margin:0}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.g-main{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:1100px){.g-main{grid-template-columns:1fr}}
@media (max-width:760px){.g2{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);min-width:0;margin-bottom:0}
.g-main>div>.card,.g-main>.card{margin-bottom:16px}
.stack>.card{margin-bottom:0}
.content>.card,.lesson-wrap>.card{margin-bottom:16px}
.card-h{display:flex;align-items:center;gap:8px;padding:14px 18px 0}
.card-h h3{font-size:13.5px;font-weight:600}
.card-hr{margin-left:auto;font-size:13px}
.card-b{padding:14px 18px 18px}
.ph{display:flex;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.ph>div:first-child{flex:1;min-width:240px}
.ph-t{font-size:24px;font-weight:700;letter-spacing:-.025em;display:flex;align-items:center;gap:10px}
.ph-s{color:var(--text-2);margin:6px 0 0;max-width:760px}
.ph-r{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.crumbs{font-size:12.5px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)} .crumbs a:hover{color:var(--text)}
.eyebrow{font-size:12px;font-weight:600;color:var(--muted);margin-bottom:6px}
.muted{color:var(--muted)} .small{font-size:12.5px} .accent{color:var(--accent)}
.ok-t{color:var(--ok);font-weight:600} .bad-t{color:var(--bad);font-weight:600}
.sec-t{font-size:15px;font-weight:650;margin:26px 0 12px;display:flex;align-items:center;gap:8px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;background:var(--bg-2);border:1px solid var(--line);color:var(--text-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);border-color:var(--ok-line);color:var(--ok)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);font-weight:500;font-size:13.5px;white-space:nowrap;transition:background .12s,border-color .12s;text-decoration:none!important;color:var(--text)}
.btn:hover:not(:disabled){background:var(--bg-2)}
.btn:disabled{opacity:.45}
.btn-primary{background:var(--text);border-color:var(--text);color:var(--bg)}
.btn-primary:hover:not(:disabled){background:color-mix(in oklab,var(--text) 85%,var(--bg))}
.btn-ghost{border-color:transparent;background:transparent}
.btn-sm{height:28px;padding:0 10px;font-size:12.5px;gap:5px}
.btn-block{width:100%}
.btn-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn-danger-ghost{color:var(--bad)}
.btn.flagged{color:var(--warn)}
.btn-icon{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;font-size:13px}
.btn-icon:disabled{opacity:.35}
.seg{display:inline-flex;flex-wrap:wrap;gap:2px;padding:3px;background:var(--bg-2);border:1px solid var(--line);border-radius:9px;margin-bottom:10px}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:6px;font-size:12.5px;font-weight:500;color:var(--text-2)}
.seg button:hover{color:var(--text)}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chipbtn{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 11px;font-size:12.5px;font-weight:500;color:var(--text-2);line-height:1.4}
.chipbtn small{color:var(--muted);margin-left:3px}
.chipbtn:hover{border-color:var(--muted)}
.chipbtn.sel{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-2)}
.chipbtn.sm{padding:2px 9px;font-size:12px}
.chipbtn.right{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.chipbtn.wrong{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.inp{font:inherit;font-size:13.5px;color:var(--text);background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:7px 10px;width:100%;outline:none;transition:border-color .12s,box-shadow .12s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
textarea.inp{resize:vertical;line-height:1.5}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12.5px;font-weight:500;color:var(--text-2);margin-bottom:12px;flex:1;min-width:110px}
.fld-l{font-size:12.5px;font-weight:600;color:var(--text-2);margin:14px 0 7px}
.fld-l:first-child{margin-top:0}
.check{display:flex;gap:8px;align-items:center;margin:8px 0;font-size:13.5px}
.range{width:100%;accent-color:var(--accent)}
.pbar{flex:1;height:6px;background:var(--bg-2);border-radius:99px;overflow:hidden;min-width:40px;border:1px solid var(--line)}
.pbar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.pbar.faint i{background:var(--line-2)}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0}
.stat-l{font-size:12px;color:var(--muted);font-weight:500}
.stat-v{font-size:22px;font-weight:700;letter-spacing:-.02em;margin:3px 0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat-s{font-size:12px;color:var(--text-2);display:flex;align-items:center;gap:6px;min-height:18px}
.lvl{font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;white-space:nowrap;border:1px solid var(--line);color:var(--muted);background:var(--bg-2)}
.lvl.l1{color:var(--text-2)} .lvl.l2{color:var(--warn);background:var(--warn-soft);border-color:var(--warn-line)} .lvl.l3{color:var(--accent-2);background:var(--accent-soft);border-color:var(--accent-line)} .lvl.l4{color:var(--ok);background:var(--ok-soft);border-color:var(--ok-line)}
.ubadge{display:inline-grid;place-items:center;min-width:22px;height:22px;padding:0 5px;border-radius:6px;font-size:11.5px;font-weight:700;color:var(--uc);background:color-mix(in oklab,var(--uc) 12%,var(--surface));border:1px solid color-mix(in oklab,var(--uc) 30%,var(--surface));flex-shrink:0}
.ubadge.lg{min-width:34px;height:34px;font-size:15px;border-radius:9px}
.dots{display:inline-flex;gap:3px;align-items:center}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.dots i.on{background:var(--text-2)}
.dtag{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:600;padding:1px 8px 1px 7px;border-radius:99px;border:1px solid var(--line);white-space:nowrap;flex-shrink:0;color:var(--dc);background:color-mix(in oklab,var(--dc) 10%,var(--surface));border-color:color-mix(in oklab,var(--dc) 28%,var(--surface))}
.dtag i{width:5px;height:5px;border-radius:50%;background:color-mix(in oklab,var(--dc) 25%,var(--surface))}
.dtag i.on{background:var(--dc)}
.dtag i:last-of-type{margin-right:3px}
.dtag.d1{--dc:var(--ok)} .dtag.d2{--dc:var(--accent)} .dtag.d3{--dc:var(--warn)} .dtag.d4{--dc:var(--bad)}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:12px 0}
.kv>div{background:var(--bg-2);border:1px solid var(--line);border-radius:8px;padding:8px 11px;display:flex;flex-direction:column;gap:2px;min-width:0}
.kv span{font-size:12px;color:var(--muted)}
.kv b{font-size:15px;font-weight:650}
.tbl-wrap{overflow-x:auto;margin:10px 0;border:1px solid var(--line);border-radius:10px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:600;font-size:12px;color:var(--muted);background:var(--bg-2);padding:8px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl.hov tbody tr{cursor:pointer} .tbl.hov tbody tr:hover td{background:var(--bg-2)}
.banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid var(--accent-line);background:var(--accent-soft);border-radius:var(--r);margin-bottom:16px;font-size:13.5px}
.banner span{flex:1}
.empty-state{text-align:center;padding:48px 20px;border:1px dashed var(--line-2);border-radius:var(--r);background:var(--surface)}
.empty-state h3{margin:10px 0 6px}
.big-num{font-size:44px;font-weight:700;letter-spacing:-.03em}
.toasts{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;align-items:center}
.toast{background:var(--text);color:var(--bg);padding:9px 16px;border-radius:9px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);display:flex;gap:7px;align-items:center;animation:tin .2s;transition:opacity .3s}
.toast.out{opacity:0}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
.modal-bg{position:fixed;inset:0;background:rgba(10,10,10,.42);z-index:90;display:flex;align-items:center;justify-content:center;padding:16px;animation:tin .15s}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);width:100%;max-width:460px;max-height:86vh;overflow:auto}
.modal-h{font-weight:650;font-size:16px;padding:18px 20px 0}
.modal-b{padding:12px 20px;color:var(--text-2)}
.modal-f{display:flex;justify-content:flex-end;gap:8px;padding:0 20px 18px}
.tip{position:fixed;left:0;top:0;z-index:120;pointer-events:none;background:var(--text);color:var(--bg);font-size:12px;line-height:1.45;padding:7px 10px;border-radius:7px;max-width:280px;opacity:0;transition:opacity .1s}
.tip.show{opacity:1}

/* dashboard */
.hero{display:flex;gap:24px;align-items:center;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px 26px;margin-bottom:16px;flex-wrap:wrap}
.hero-t{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-bottom:6px}
.hero-rings{display:flex;gap:16px}
.ring{position:relative;display:inline-grid;place-items:center}
.ring svg{position:absolute;inset:0}
.ring-l{text-align:center;line-height:1.15}
.ring-l b{display:block;font-size:20px;font-weight:700;letter-spacing:-.02em}
.ring-l small{font-size:11px;color:var(--muted)}
.recs{display:flex;flex-direction:column;gap:6px}
.rec{display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);text-align:left;width:100%}
.rec:hover:not(:disabled){border-color:var(--line-2);background:var(--bg-2)}
.rec:disabled{opacity:.5}
.rec>span:nth-child(2){flex:1;min-width:0}
.rec b{display:block;font-weight:600;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rec small{color:var(--muted);font-size:12px}
.rec-i{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;background:var(--bg-2);color:var(--text-2);flex-shrink:0}
.rec.pri{border-color:var(--accent-line);background:var(--accent-soft)}
.rec.pri .rec-i{background:var(--accent);color:#fff}
.ulist{display:flex;flex-direction:column}
.urow{display:flex;align-items:center;gap:12px;padding:9px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%;border-radius:0}
.urow:last-child{border-bottom:0}
.urow:hover{background:var(--bg-2)}
.urow-n{flex:1;min-width:0}
.urow-n b{display:block;font-weight:550;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.urow-n small{color:var(--muted);font-size:12px}
.urow-p{width:90px;display:flex}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) 90px 40px;gap:10px;align-items:center;font-size:12.5px;padding:5px 0;cursor:pointer;color:var(--text-2)}
.mrow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mrow b{text-align:right;color:var(--text)}
@media (max-width:600px){.urow-p{display:none}.hero-rings{display:none}}

/* curriculum */
.ugrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.ucard{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px 16px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);position:relative;overflow:hidden}
.ucard:hover{border-color:var(--line-2);box-shadow:0 4px 16px rgba(0,0,0,.05)}
.ucard::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--uc)}
.ucard-top{display:flex;justify-content:space-between;align-items:center}
.ucard-n{font-size:12px;font-weight:600;color:var(--uc)}
.ucard h3{font-size:15px}
.ucard p{color:var(--text-2);font-size:13px;margin:0;flex:1}
.ucard-f{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}
.llist{display:flex;flex-direction:column}
.lrow{display:flex;gap:12px;align-items:center;padding:11px 6px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.lrow:last-child{border-bottom:0}
.lrow:hover{background:var(--bg-2)}
.lrow-c{width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);flex-shrink:0}
.lrow.done .lrow-c{background:var(--ok);border-color:var(--ok);color:#fff}
.lrow-t{flex:1;min-width:0}
.lrow-t b{display:block;font-weight:550}
.lrow-t small{color:var(--muted);font-size:12.5px}
.lrow-m{display:flex;gap:8px;align-items:center}
.obj{margin:0;padding-left:18px;color:var(--text-2);font-size:13.5px}
.obj li{margin-bottom:6px}

/* lesson */
.lesson{max-width:780px;margin:0 auto}
.lh{margin-bottom:26px;padding-bottom:20px;border-bottom:1px solid var(--line)}
.lh h1{font-size:30px;font-weight:700;letter-spacing:-.03em}
.lh-s{font-size:16px;color:var(--text-2);margin:8px 0 0}
.lh-m{display:flex;gap:14px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--muted)}
.prose{font-size:15.5px;line-height:1.7}
.prose h2{font-size:20px;margin:34px 0 10px;letter-spacing:-.02em}
.prose h3{font-size:16.5px;margin:24px 0 8px}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{margin:0 0 14px;padding-left:22px}
.prose li{margin-bottom:5px}
.prose li::marker{color:var(--muted)}
.prose b,.prose strong{font-weight:620}
.prose .tbl{font-size:13.5px}
.callout{border:1px solid var(--line);border-radius:10px;padding:12px 16px;margin:18px 0;background:var(--surface);font-size:14.5px}
.callout ul{margin:4px 0 0;padding-left:20px}
.callout li{margin-bottom:4px}
.co-h{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:5px;color:var(--muted)}
.callout.key{border-color:var(--accent-line);background:var(--accent-soft)} .callout.key .co-h{color:var(--accent-2)}
.callout.tip{border-color:var(--ok-line);background:var(--ok-soft)} .callout.tip .co-h{color:var(--ok)}
.callout.warn{border-color:var(--warn-line);background:var(--warn-soft)} .callout.warn .co-h{color:var(--warn)}
.formula{margin:14px 0;padding:12px 14px;background:var(--bg-2);border-radius:10px;overflow-x:auto;text-align:center}
.formula .katex-display{margin:0}
.formula-cap{font-size:12.5px;color:var(--muted);margin-top:4px}
.mini-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:14px 0 18px}
.mini-card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface);display:flex;flex-direction:column;gap:4px;font-size:13.5px;line-height:1.5}
.mini-card b{font-size:14px}
.mini-card span{color:var(--text-2)}
.lesson-end{margin-top:40px;display:flex;flex-direction:column;gap:14px}
.le-card{border:1px solid var(--line);border-radius:var(--r);padding:18px;background:var(--surface);display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.le-card p{margin:2px 0 0}
.le-nav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.le-btn{border:1px solid var(--line);border-radius:var(--r);padding:12px 16px;background:var(--surface);text-align:left;display:flex;flex-direction:column;gap:2px}
.le-btn:hover{border-color:var(--line-2)}
.le-btn small{color:var(--muted);font-size:12px}
.le-btn.r{text-align:right;grid-column:2}

/* widgets */
.wg{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin:22px 0;font-size:14px;line-height:1.55;overflow:hidden}
.wg-h{display:flex;align-items:center;gap:10px;padding:11px 16px;border-bottom:1px solid var(--line);background:var(--bg-2)}
.wg-k{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--accent-2);background:var(--accent-soft);border:1px solid var(--accent-line);padding:1px 7px;border-radius:5px;white-space:nowrap}
.wg-t{font-weight:600;font-size:13.5px}
.wg-b{padding:16px}
.wg-f{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line);flex-wrap:wrap;background:var(--bg-2)}
.wg-f .seg{margin:0}
.wf-msg{font-size:13px}
.wg-p{margin:0 0 12px;color:var(--text-2)}
.wres{display:flex;gap:7px;align-items:center;margin-top:10px;font-size:13.5px}
.wres.ok{color:var(--ok)} .wres.bad{color:var(--bad)}
.qc-q{font-weight:550;margin-bottom:12px;font-size:15px}
.qc-c{display:flex;flex-direction:column;gap:6px}
.sl-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 18px;margin-bottom:12px}
.sl{display:flex;flex-direction:column;gap:2px;font-size:12.5px;color:var(--text-2)}
.sl b{color:var(--text);font-family:var(--mono);font-weight:500}
.sl input{width:100%;accent-color:var(--accent)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--font)}
.chart .gl,svg .gl{stroke:var(--line);stroke-width:1}
.chart .al{stroke:var(--line-2);stroke-width:1}
.chart .xh{stroke:var(--line-2);stroke-dasharray:3 3;opacity:0}
.chart .hg:hover .xh{opacity:1}
.chart .hit{fill:transparent}
.chart .reflab,svg .reflab{font-size:11px;fill:var(--text-2);font-weight:500}
.chart .rlab{font-size:12px;font-weight:600;fill:var(--text-2)}
svg .nlab{font-size:13px;font-weight:600;fill:var(--text);font-family:var(--font)}
.chart.click{cursor:crosshair}
.chart-empty{display:flex;flex-direction:column;gap:8px;align-items:center;justify-content:center;color:var(--muted);font-size:13px;border:1px dashed var(--line-2);border-radius:10px;background:var(--bg-2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--text-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(90px,38%) 1fr 64px;gap:10px;align-items:center;font-size:12.5px}
.hb[data-go]{cursor:pointer}
.hb-l{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-2)}
.hb-t{height:10px;background:var(--bg-2);border-radius:99px;position:relative;border:1px solid var(--line)}
.hb-t i{display:block;height:100%;border-radius:99px;transition:width .4s}
.hb-t b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--text-2);border-radius:2px}
.hb-v{text-align:right;font-weight:600;font-variant-numeric:tabular-nums}
.cal{overflow-x:auto}
.cal-m{display:flex;gap:3px;font-size:10.5px;color:var(--muted);height:15px}
.cal-m span{width:13px;flex-shrink:0;white-space:nowrap}
.cal-g{display:flex;gap:3px}
.cal-col{display:flex;flex-direction:column;gap:3px}
.cal i,.cal-leg i{width:13px;height:13px;border-radius:3px;display:block;background:var(--h0)}
.cal i.h1,.cal-leg i.h1{background:var(--h1)} .cal i.h2,.cal-leg i.h2{background:var(--h2)} .cal i.h3,.cal-leg i.h3{background:var(--h3)} .cal i.h4,.cal-leg i.h4{background:var(--h4)}
.cal-leg{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--muted);margin-top:8px;justify-content:flex-end}
.mx{display:grid;gap:3px;font-size:12px;overflow-x:auto}
.mx-h{text-align:center;color:var(--muted);font-weight:600;padding:2px}
.mx-r{color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:6px 6px 6px 0}
.mx-c{text-align:center;padding:6px 2px;border-radius:5px;background:var(--bg-2);font-weight:600;font-variant-numeric:tabular-nums;color:var(--muted)}
.mx-c[style*="background"]{color:var(--text)}

/* choices & questions */
.choice{display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line-2);border-radius:10px;background:var(--surface);font-size:14.5px;line-height:1.5;transition:border-color .1s,background .1s}
.choice.sm{padding:8px 12px;font-size:14px}
.choice:hover:not(:disabled){border-color:var(--text-2)}
.choice .lt{width:24px;height:24px;border-radius:50%;border:1px solid var(--line-2);display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0;color:var(--text-2);margin-top:-1px}
.choice .ct{flex:1;min-width:0}
.choice .cm{margin-left:auto}
.choice.sel{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 1px var(--accent)}
.choice.sel .lt{background:var(--accent);border-color:var(--accent);color:#fff}
.choice.right{border-color:var(--ok);background:var(--ok-soft)} .choice.right .lt{background:var(--ok);border-color:var(--ok);color:#fff} .choice.right .cm{color:var(--ok)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)} .choice.wrong .lt{background:var(--bad);border-color:var(--bad);color:#fff} .choice.wrong .cm{color:var(--bad)}
.choice.dim{opacity:.55}
.choice:disabled{cursor:default;color:var(--text)}
.choices{display:flex;flex-direction:column;gap:8px}
.explain{margin-top:14px;padding:13px 16px;border-radius:10px;border:1px solid var(--line);background:var(--bg-2);font-size:14px;line-height:1.6}
.explain.ok{border-color:var(--ok-line)} .explain.bad{border-color:var(--bad-line)}
.ex-h{font-weight:650;display:flex;gap:6px;align-items:center;margin-bottom:5px}
.explain.ok .ex-h{color:var(--ok)} .explain.bad .ex-h{color:var(--bad)}
.ex-f{margin-top:8px;font-size:12px;color:var(--muted)}
.qs{max-width:780px;margin:0 auto}
.qs-top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.qs-prog{flex:1;display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px 24px;box-shadow:var(--shadow)}
.qmeta{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--muted);margin-bottom:12px}
.qmeta a{color:var(--muted)}
.qstem{font-size:16.5px;line-height:1.6;margin-bottom:18px;font-weight:500}
.qstem.sm{font-size:14.5px}
.conf{display:flex;align-items:center;gap:6px;margin-top:14px}
.qs-foot{display:flex;align-items:center;gap:10px;margin-top:14px}
.kbd-hint{flex:1;text-align:center;font-size:12px;color:var(--muted)}
@media (max-width:640px){.kbd-hint{display:none}.qcard{padding:18px 16px}}
.ans-row{display:flex;gap:8px;max-width:440px}
.ans-in{font-family:var(--mono);font-size:15px}
.rv-i{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--surface)}
.rv-i summary{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;list-style:none;font-size:13.5px}
.rv-i summary::-webkit-details-marker{display:none}
.rv-n{font-size:12px;color:var(--muted);width:22px;font-variant-numeric:tabular-nums}
.rv-s{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;background:var(--bg-2);color:var(--muted)}
.rv-i.ok .rv-s{background:var(--ok-soft);color:var(--ok)} .rv-i.bad .rv-s{background:var(--bad-soft);color:var(--bad)}
.rv-q{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv-b{padding:4px 14px 14px}
.fb{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.fb li{padding:9px 12px 9px 14px;border-radius:9px;background:var(--bg-2);border-left:3px solid var(--line-2);font-size:13.5px;line-height:1.5}
.fb li.ok{border-left-color:var(--ok)} .fb li.bad{border-left-color:var(--bad)} .fb li.warn{border-left-color:var(--warn)} .fb li.info{border-left-color:var(--accent)}

/* sort / match / order / timeline / flip / steps */
.pool{display:flex;flex-wrap:wrap;gap:6px;padding:10px;border:1px dashed var(--line-2);border-radius:10px;min-height:46px;margin-bottom:10px;background:var(--bg-2)}
.buckets{display:grid;gap:8px}
@media (max-width:640px){.buckets{grid-template-columns:1fr 1fr!important}}
.bucket{border:1px solid var(--line-2);border-radius:10px;padding:8px;min-height:90px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;cursor:pointer;background:var(--surface)}
.bucket:hover{border-color:var(--accent)}
.bucket-h{width:100%;font-size:12px;font-weight:650;color:var(--text-2);padding-bottom:6px;border-bottom:1px solid var(--line);margin-bottom:2px}
.match{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.match>div{display:flex;flex-direction:column;gap:6px}
.mt{text-align:left;padding:8px 11px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface);font-size:13px;line-height:1.45}
.mt:hover:not(:disabled){border-color:var(--text-2)}
.mt.sel{border-color:var(--accent);background:var(--accent-soft)}
.mt.right{border-color:var(--ok-line);background:var(--ok-soft);color:var(--ok);opacity:.75}
.match.big .mt{padding:11px 14px;font-size:13.5px}
.shake{animation:shake .35s;border-color:var(--bad)!important}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.ord{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ord li{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line-2);border-radius:9px;background:var(--surface)}
.ord li.right{border-color:var(--ok);background:var(--ok-soft)} .ord li.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ord-n{width:22px;height:22px;border-radius:50%;background:var(--bg-2);display:grid;place-items:center;font-size:12px;font-weight:600;flex-shrink:0}
.ord-t{flex:1}
.ord-b{display:flex;gap:4px}
.tl-track{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:thin}
.tl-dot{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--text-2);font-variant-numeric:tabular-nums}
.tl-dot.sel{background:var(--text);border-color:var(--text);color:var(--bg)}
.tl-dot.tl-winter{border-style:dashed;color:var(--s1)}
.tl-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg-2)}
.tl-y{font-size:12px;font-weight:700;color:var(--accent)}
.tl-h{font-weight:650;font-size:16px;margin:2px 0 6px}
.tl-d{color:var(--text-2);font-size:14px}
.tl-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.flips{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:10px}
@media (max-width:640px){.flips{grid-template-columns:1fr 1fr}}
.flipc{position:relative;min-height:120px;border:0;background:none;padding:0;perspective:800px}
.flipc .ff,.flipc .fb{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:12px;border-radius:10px;border:1px solid var(--line-2);backface-visibility:hidden;transition:transform .4s;font-size:13px;line-height:1.45}
.flipc .ff{background:var(--surface);font-weight:650;font-size:14.5px}
.flipc .fb{background:var(--accent-soft);border-color:var(--accent-line);transform:rotateY(180deg)}
.flipc.flipped .ff{transform:rotateY(180deg)} .flipc.flipped .fb{transform:none}
.stp-bar{display:flex;align-items:center;margin-bottom:14px;overflow-x:auto}
.stp-dot{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);font-size:12px;font-weight:600;flex-shrink:0;color:var(--muted)}
.stp-dot.past{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent-2)}
.stp-dot.sel{background:var(--text);border-color:var(--text);color:var(--bg)}
.stp-ln{flex:1;height:1px;background:var(--line-2);min-width:12px}
.stp-card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--bg-2);margin-bottom:12px;min-height:110px}
.stp-h{font-weight:650;margin-bottom:6px}
.stp-b{color:var(--text-2)}
.tab-b{padding-top:4px}
.rv{margin-top:10px;padding:12px 14px;border-radius:10px;background:var(--ok-soft);border:1px solid var(--ok-line)}
.cl{display:flex;flex-direction:column;gap:2px}
.cl-i{display:flex;gap:10px;align-items:flex-start;padding:6px 4px;border-radius:6px;font-size:13.5px;cursor:pointer}
.cl-i:hover{background:var(--bg-2)}
.cl-i input{margin-top:3px;accent-color:var(--accent)}
.cl-i.done span{color:var(--muted);text-decoration:line-through}

/* sims */
.splitbar{display:flex;height:34px;border-radius:8px;overflow:hidden;gap:2px;margin-bottom:6px}
.splitbar i{display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:12px;font-weight:600;min-width:0;white-space:nowrap;overflow:hidden}
.people{display:grid;grid-template-columns:repeat(50,1fr);gap:1px;margin-bottom:6px}
.people i{aspect-ratio:1;border-radius:1px;background:var(--line)}
.people i.tp{background:var(--s2)} .people i.fn{background:var(--s4)} .people i.fp{background:var(--s1)}
.cm{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px;max-width:440px}
.cm-h{font-size:12px;font-weight:600;color:var(--muted);text-align:center;align-self:end}
.cm-h.cm-side{align-self:center;text-align:right;padding-right:4px}
.cm-cell{border-radius:9px;padding:10px;font-size:12px;font-weight:700;display:flex;flex-direction:column;gap:5px}
.cm-cell.tp,.cm-cell.tn{background:var(--ok-soft);color:var(--ok);border:1px solid var(--ok-line)}
.cm-cell.fp,.cm-cell.fn{background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.cm-in{padding:5px 8px;font-size:15px;font-weight:600}
.mm-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.mtx{display:flex;flex-direction:column;gap:4px;padding:6px 8px;border-left:2px solid var(--text-2);border-right:2px solid var(--text-2);border-radius:6px}
.mtx-r{display:flex;gap:4px}
.mtx.out .mtx-r{min-width:44px;height:34px;align-items:center;justify-content:center;font-size:16px}
.mm{width:52px;text-align:center;padding:5px}
.mm-op{font-size:20px;color:var(--muted);font-weight:300}

<body class="locked">
<div class="gate" id="gate">

<script>
/* Login gate: app.js is shipped AES-GCM encrypted (content.enc.json, built by build.mjs).
 * The key is derived from username + password; the derived key is kept in localStorage
 * until sign-out or session expiry so reloads don't require logging in again. */
(() => {
  const SESSION_KEY = 'oneai-session';
  const $g = id => document.getElementById(id);
  const u8 = b64 => Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  let bundle;

  // Match the app's saved theme on the login screen.
  try { const t = JSON.parse(localStorage.getItem('oneai-v2')).settings.theme; if (t && t !== 'auto') document.documentElement.dataset.theme = t; } catch (e) {}

  const getBundle = () => bundle || (bundle = fetch('content.enc.json', { cache: 'no-cache' }).then(r => { if (!r.ok) throw new Error('load'); return r.json(); }));
  const readSession = () => { try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch (e) { return null; } };
  const clearSession = () => { try { localStorage.removeItem(SESSION_KEY); } catch (e) {} };

  async function unlock(key, b) {
    const code = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(b.iv) }, key, u8(b.data)));
    document.body.classList.remove('locked');
    const s = document.createElement('script');
    s.src = URL.createObjectURL(new Blob([code], { type: 'text/javascript' }));
    document.body.appendChild(s);
  }

  async function resume() {
    const sess = readSession();
    if (!sess || !sess.k || Date.now() > sess.exp) { clearSession(); return false; }
    try {
      const b = await getBundle();
      if (sess.salt !== b.salt) { clearSession(); return false; } // content rebuilt / credentials changed
      await unlock(await crypto.subtle.importKey('raw', u8(sess.k), 'AES-GCM', false, ['decrypt']), b);
      return true;
    } catch (e) { clearSession(); return false; }
  }

  $g('gateForm').addEventListener('submit', async e => {
    e.preventDefault();
    const btn = $g('gateBtn'), err = $g('gateErr');
    btn.disabled = true; btn.textContent = 'Signing in…'; err.textContent = '';
    try {
      const b = await getBundle();
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode($g('gateUser').value.trim() + '\n' + $g('gatePass').value), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt: u8(b.salt), iterations: b.iter }, base, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
      try { await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u8(b.iv) }, key, u8(b.data)); }
      catch (x) { throw new Error('creds'); }
      try { localStorage.setItem(SESSION_KEY, JSON.stringify({ k: b64(await crypto.subtle.exportKey('raw', key)), salt: b.salt, exp: Date.now() + b.sessionDays * 864e5 })); } catch (x) {}
      $g('gatePass').value = '';
      await unlock(key, b);
    } catch (x) {
      err.textContent = x.message === 'creds' ? 'Incorrect username or password.' : 'Couldn’t load the site. Check your connection and try again.';
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  });

  $g('signOutBtn').addEventListener('click', () => { clearSession(); location.reload(); });

  // End the session in open tabs once it expires (or after sign-out in another tab).
  setInterval(() => { if (document.body.classList.contains('locked')) return; const s = readSession(); if (!s || Date.now() > s.exp) { clearSession(); location.reload(); } }, 60000);
  addEventListener('storage', e => { if (e.key === SESSION_KEY && !e.newValue && !document.body.classList.contains('locked')) location.reload(); });

  resume().then(ok => { if (!ok) $g('gateUser').focus(); });
})();
</script>
